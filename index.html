<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Visibility Audit for Commercial Contractors | Estes Media</title>
    <meta
      name="description"
      content="Free AI Visibility Audit. See exactly where your company shows up in ChatGPT, Perplexity, and Google AI — and what being invisible is costing you in bids."
    />
    <meta name="theme-color" content="#101317" />
    <meta name="color-scheme" content="dark" />

    <!-- Social preview. og:image is relative; make it absolute once the
         production domain is locked in, so scrapers that don't resolve
         relative paths still pick it up. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estes Media" />
    <meta property="og:title" content="Your Competitors Are Already Showing Up in AI Search. You're Not." />
    <meta
      property="og:description"
      content="60% of B2B buyers use AI to find contractors before they ever call. Get a free AI Visibility Audit from Estes Media."
    />
    <meta property="og:image" content="/og-image.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Competitors Are Already Showing Up in AI Search. You're Not." />
    <meta
      name="twitter:description"
      content="60% of B2B buyers use AI to find contractors before they ever call. Get a free AI Visibility Audit from Estes Media."
    />
    <meta name="twitter:image" content="/og-image.webp" />

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted, latin-only. Preload the two faces that render the hero so
         they are in flight before the stylesheet has even parsed. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-serif-display-latin-400-normal.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-latin-400-normal.woff2" crossorigin />

    <!-- Third-party tags are injected after first paint (see
         useMarketingScripts). Warming the connections here means the handshake
         is already done when they fire, without blocking the critical path. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://js.hs-scripts.com" />
  </head>

  <body>
    <!-- Meta Pixel <noscript> fallback (must live in <body>) -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=280824040008191&ev=PageView&noscript=1"
    /></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
